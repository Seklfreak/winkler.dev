name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject analytics id
        env:
          GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
        run: |
          if [ -n "$GA_TRACKING_ID" ]; then
            sed -i "s/__GA_TRACKING_ID__/$GA_TRACKING_ID/g" site/index.html
          else
            # no id configured: strip the analytics block entirely
            sed -i '/<!-- analytics:start -->/,/<!-- analytics:end -->/d' site/index.html
          fi
          ! grep -q __GA_TRACKING_ID__ site/index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true

      - name: Purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      - name: Run Lighthouse
        uses: foo-software/lighthouse-check-action@master
        with:
          urls: "https://winkler.dev/"
