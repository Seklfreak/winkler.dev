name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust asset URLs
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s|style.css\"|style.css?v=$V\"|g; s|\.woff2\"|.woff2?v=$V\"|g" site/index.html site/404.html
          sed -i "s|\.woff2\")|.woff2?v=$V\")|g" site/style.css
          grep -c "v=$V" site/index.html site/404.html site/style.css

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true

      - name: Purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      - name: Run Lighthouse
        uses: foo-software/lighthouse-check-action@master
        with:
          urls: "https://winkler.dev/"
