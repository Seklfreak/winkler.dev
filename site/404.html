<!doctype html>

<head>

  <link rel="stylesheet" href="/style.css">
  <!-- Self-hosted Umami (winkcloud repo). Served from a subdomain of this
       site, so it is first-party and survives tracker blocklists better than
       a third-party origin would. data-domains stops local previews from
       polluting the stats; www 301s to the apex so it needs no entry. -->
  <script defer src="https://stats.winkler.dev/s.js" data-website-id="d7d95658-dc3f-4fa7-a4c6-a7434a8b52ea" data-domains="winkler.dev"></script>
</head>
<body>
  <main class="poster">
    <h1 class="name" aria-label="Not found">
      <span class="layer on-yellow" aria-hidden="true"><span class="first">Not</span><span class="last">Found</span></span>
      <span class="layer on-black" aria-hidden="true"><span class="first">Not</span><span class="last">Found</span></span>
    </h1>
    <ul class="details">
      <li>404</li>
      <li><a href="/">winkler.dev</a></li>
    </ul>
    <ul class="links">
      <li><a href="mailto:sebastian@winkler.dev" target="_blank" rel="noopener">sebastian@winkler.dev</a></li>
    </ul>
  </main>
</body>
</html>
