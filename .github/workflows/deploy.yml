name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache-bust asset URLs
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s|style.css\"|style.css?v=$V\"|g; s|\.woff2\"|.woff2?v=$V\"|g" site/index.html site/404.html
          sed -i "s|\.woff2\")|.woff2?v=$V\")|g" site/style.css
          grep -c "v=$V" site/index.html site/404.html site/style.css

      # Cloudflare Pages, not GitHub Pages: GitHub could never issue a
      # certificate for this domain (it resolves the name publicly, sees
      # Cloudflare's addresses rather than its own, and refuses), and the usual
      # grey-cloud workaround is impossible because the .dev TLD is
      # HSTS-preloaded. Pages serves the files directly, so there is no origin
      # certificate to provision.
      #
      # No cache purge step any more — Pages invalidates on deploy.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=winkler-dev --branch=master

      - name: Run Lighthouse
        uses: foo-software/lighthouse-check-action@master
        with:
          urls: "https://winkler.dev/"
